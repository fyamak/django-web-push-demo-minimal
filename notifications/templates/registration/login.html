<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Giriş</title><style>body{font-family:system-ui;background:#f3f4f6}.box{max-width:380px;margin:10vh auto;background:#fff;padding:24px;border-radius:12px}input{width:100%;box-sizing:border-box;padding:10px;margin:5px 0 12px}button{width:100%;padding:10px;background:#111827;color:#fff;border:0;border-radius:8px}</style></head>
<body><div class="box"><h1>Giriş</h1><form method="post">{% csrf_token %}{{ form.non_field_errors }}<label>Kullanıcı adı</label>{{ form.username }}<label>Şifre</label>{{ form.password }}<button>Giriş yap</button></form><p>Hesabın yok mu? <a href="{% url 'notifications:signup' %}">Kayıt ol</a></p></div></body></html>
