<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kayıt</title><style>body{font-family:system-ui;background:#f3f4f6}.box{max-width:420px;margin:6vh auto;background:#fff;padding:24px;border-radius:12px}input{width:100%;box-sizing:border-box;padding:10px;margin:5px 0 12px}button{width:100%;padding:10px;background:#111827;color:#fff;border:0;border-radius:8px}.errorlist{color:#b91c1c}</style></head>
<body><div class="box"><h1>Kayıt ol</h1><form method="post">{% csrf_token %}{{ form.non_field_errors }}<label>Kullanıcı adı</label>{{ form.username }}{{ form.username.errors }}<label>E-posta</label>{{ form.email }}{{ form.email.errors }}<label>Şifre</label>{{ form.password1 }}{{ form.password1.errors }}<label>Şifre tekrar</label>{{ form.password2 }}{{ form.password2.errors }}<button>Kayıt ol</button></form><p><a href="{% url 'login' %}">Girişe dön</a></p></div></body></html>
